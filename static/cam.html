    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('offscreen-canvas');
        const shutterInner = document.getElementById('shutter-inner');
        const loader = document.getElementById('loader');
        const focusOverlay = document.getElementById('focus-overlay');
        const exposureInput = document.getElementById('exposure-input');
        const galleryPreview = document.getElementById('gallery-preview');
        const galleryCounter = document.getElementById('gallery-counter');

        let stream = null;
        let track = null;
        let mode = 'Photo';
        let facing = 'environment';
        let captures = [];
        let logoImg = new Image();
        logoImg.src = 'static/logo.png'; // Maintain same path

        async function startCamera() {
            if (stream) stream.getTracks().forEach(t => t.stop());
            
            const constraints = {
                video: {
                    facingMode: facing,
                    width: { ideal: 4096 },
                    height: { ideal: 2160 },
                    frameRate: { ideal: 60 }
                },
                audio: true
            };

            try {
                stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                track = stream.getVideoTracks()[0];
                
                // Set initial zoom capabilities
                const caps = track.getCapabilities();
                if (caps.zoom) {
                    // Implementation for pinch zoom could be added here
                }
            } catch (e) {
                console.error("Camera access denied", e);
            }
        }

        function changeMode(newMode) {
            mode = newMode;
            document.querySelectorAll('.mode-item').forEach(el => {
                el.classList.toggle('mode-active', el.innerText.includes(newMode));
            });
            shutterInner.style.backgroundColor = (mode === 'Video' || mode === 'Time-lapse') ? '#ef4444' : '#fff';
            
            // Mode-specific scroll centering
            const container = document.getElementById('mode-list');
            const target = Array.from(container.children).find(c => c.innerText.includes(newMode));
            target.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        }

        async function takeAction() {
            if (mode === 'Photo' || mode === 'Clarity' || mode === 'Portrait') {
                await captureImage();
            } else {
                // Handle video start/stop
            }
        }

        async function captureImage() {
            loader.classList.remove('hidden');
            loader.classList.add('flex');

            const settings = track.getSettings();
            canvas.width = settings.width;
            canvas.height = settings.height;
            const ctx = canvas.getContext('2d', { alpha: false });

            // Mirror if front camera
            if (facing === 'user') {
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
            }

            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Simulation of high-MP processing
            const processingTime = mode === 'Clarity' ? 1800 : 600;

            setTimeout(() => {
                // Apply Logo Watermark
                const logoSize = Math.min(canvas.width, canvas.height) * 0.08;
                if (logoImg.complete) {
                    ctx.drawImage(logoImg, canvas.width - logoSize - 50, canvas.height - logoSize - 50, logoSize, logoSize);
                }

                const dataUrl = canvas.toDataURL('image/jpeg', 1.0);
                captures.unshift(dataUrl);
                
                // Update Gallery Persistence
                galleryPreview.src = dataUrl;
                galleryPreview.classList.remove('hidden');
                galleryCounter.innerText = captures.length;
                galleryCounter.classList.remove('hidden');

                loader.classList.add('hidden');
                loader.classList.remove('flex');
            }, processingTime);
        }

        function switchCamera() {
            facing = facing === 'environment' ? 'user' : 'environment';
            startCamera();
        }

        // Tap to Focus & Exposure Logic
        document.getElementById('viewport').addEventListener('click', (e) => {
            if (e.target.closest('button')) return;

            const rect = e.currentTarget.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            focusOverlay.style.left = `${x - 40}px`;
            focusOverlay.style.top = `${y - 40}px`;
            focusOverlay.style.opacity = '1';
            focusOverlay.style.pointerEvents = 'auto';

            // Auto-hide focus after delay
            clearTimeout(window.focusTimeout);
            window.focusTimeout = setTimeout(() => {
                focusOverlay.style.opacity = '0';
                focusOverlay.style.pointerEvents = 'none';
            }, 4000);
        });

        exposureInput.addEventListener('input', (e) => {
            const val = e.target.value;
            // Map slider -2 to 2 to camera exposure if supported
            if (track && track.getCapabilities().exposureCompensation) {
                track.applyConstraints({
                    advanced: [{ exposureCompensation: val }]
                });
            }
            // Visual feedback
            video.style.filter = `brightness(${1 + (val * 0.2)})`;
        });

        // Initialize
        window.onload = startCamera;
    </script>
