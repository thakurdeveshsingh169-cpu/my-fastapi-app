<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP-Gated Group Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        .blur-locked { filter: blur(8px); pointer-events: none; user-select: none; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <!-- MAIN CONTAINER -->
    <div class="w-full max-w-md bg-slate-800 rounded-xl shadow-2xl overflow-hidden border border-slate-700 relative">
        
        <!-- HEADER -->
        <div class="p-4 bg-slate-950 border-b border-slate-800 flex justify-between items-center">
            <h1 id="chat-title" class="font-bold text-lg text-emerald-400">Group Portal</h1>
            <div class="flex gap-2">
                <button id="admin-btn" onclick="toggleAdminPanel()" class="hidden px-2 py-1 text-xs bg-amber-600 hover:bg-amber-500 rounded font-semibold">Requests</button>
                <button id="qr-btn" onclick="toggleQRModal()" class="hidden px-2 py-1 text-xs bg-slate-800 hover:bg-slate-700 rounded border border-slate-700">QR Code</button>
            </div>
        </div>

        <!-- AUTH / ENTRY FORM -->
        <div id="auth-view" class="p-6 space-y-4">
            <div>
                <label class="block text-xs uppercase text-slate-400 mb-1">Group ID</label>
                <input id="input-group-id" type="text" placeholder="e.g. K7X92P" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded focus:outline-none focus:border-emerald-500 text-white">
            </div>
            <div>
                <label class="block text-xs uppercase text-slate-400 mb-1">Group Password</label>
                <input id="input-password" type="password" placeholder="••••••••" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded focus:outline-none focus:border-emerald-500 text-white">
            </div>
            <div>
                <label class="block text-xs uppercase text-slate-400 mb-1">Your Display Name</label>
                <input id="input-username" type="text" placeholder="e.g. Rahul" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded focus:outline-none focus:border-emerald-500 text-white">
            </div>
            <div class="flex gap-2 pt-2">
                <button onclick="handleEnterGroup()" class="flex-1 py-2 bg-emerald-600 hover:bg-emerald-500 rounded font-semibold transition">Enter / Request Join</button>
                <button onclick="handleCreateGroup()" class="flex-1 py-2 bg-slate-700 hover:bg-slate-600 rounded font-semibold transition">Create Group</button>
            </div>
        </div>

        <!-- CHAT VIEW CONTAINER -->
        <div id="chat-container" class="hidden relative">
            
            <!-- BLURRED CHAT INTERFACE -->
            <div id="chat-view" class="flex flex-col h-[500px] blur-locked transition-all duration-300">
                <div id="messages-list" class="flex-1 p-4 overflow-y-auto space-y-3"></div>
                <div class="p-3 bg-slate-950 border-t border-slate-800 flex gap-2">
                    <input id="input-message" type="text" placeholder="Write a message..." class="flex-1 px-3 py-2 bg-slate-900 border border-slate-700 rounded focus:outline-none focus:border-emerald-500 text-white" onkeydown="if(event.key==='Enter') sendMessage()">
                    <button onclick="sendMessage()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 rounded font-semibold">Send</button>
                </div>
            </div>

            <!-- LOCK OVERLAY FOR UNAPPROVED USERS -->
            <div id="lock-overlay" class="absolute inset-0 bg-slate-950/80 backdrop-blur-sm flex flex-col items-center justify-center p-6 text-center space-y-3 z-10">
                <div class="p-3 bg-amber-500/10 rounded-full border border-amber-500/30 text-amber-400">
                    🔒
                </div>
                <h3 class="text-lg font-bold text-white">Approval Pending</h3>
                <p class="text-xs text-slate-400">Your request has been submitted to the group admin. The screen will unlock automatically once approved.</p>
                <div class="bg-slate-900 px-4 py-2 rounded-lg border border-slate-700 text-xs">
                    Unique Request ID: <span id="display-unique-no" class="font-mono font-bold text-emerald-400">---</span>
                </div>
            </div>

        </div>

        <!-- ADMIN REQUESTS PANEL (MODAL) -->
        <div id="admin-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-20">
            <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 w-full max-w-sm space-y-4">
                <div class="flex justify-between items-center border-b border-slate-700 pb-2">
                    <h3 class="font-bold text-amber-400">Pending Requests</h3>
                    <button onclick="toggleAdminPanel()" class="text-slate-400 hover:text-white">✕</button>
                </div>
                <div id="requests-list" class="max-h-60 overflow-y-auto space-y-2">
                    <!-- Dynamic Requests Rendered Here -->
                </div>
            </div>
        </div>

        <!-- QR MODAL -->
        <div id="qr-modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-20">
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 text-center space-y-4 max-w-xs w-full">
                <h2 class="text-lg font-bold">Group QR Code</h2>
                <div id="qrcode" class="flex justify-center bg-white p-4 rounded"></div>
                <button onclick="toggleQRModal()" class="w-full py-2 bg-slate-700 hover:bg-slate-600 rounded">Close</button>
            </div>
        </div>

    </div>

    <script>
        const SUPABASE_URL = 'https://yjrskrapomaxopffzlxf.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_fVxEacBEBrICbXaT1od_dQ_I8vL6Nvg';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentGroupId = null;
        let currentUsername = null;
        let userIpHash = null;
        let isAdmin = false;

        // INITIALIZATION
        window.addEventListener('DOMContentLoaded', async () => {
            userIpHash = await getHashedIP();
            const params = new URLSearchParams(window.location.search);
            if (params.has('group')) {
                document.getElementById('input-group-id').value = params.get('group');
            }
        });

        // IP RESOLUTION AND HASHING
        async function getHashedIP() {
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                return await sha256(data.ip);
            } catch (e) {
                return await sha256(navigator.userAgent + Math.random());
            }
        }

        async function sha256(str) {
            const buffer = new TextEncoder().encode(str);
            const hash = await crypto.subtle.digest('SHA-256', buffer);
            return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // CREATE GROUP (Creator automatically becomes Admin)
        async function handleCreateGroup() {
            const groupId = document.getElementById('input-group-id').value.trim();
            const password = document.getElementById('input-password').value.trim();
            const username = document.getElementById('input-username').value.trim();

            if (!groupId || !password || !username) return alert('Fill all fields');

            const hashedPassword = await sha256(password);
            const { error } = await supabase.from('groups').insert([{
                id: groupId,
                name: groupId,
                password_hash: hashedPassword,
                admin_ip_hash: userIpHash
            }]);

            if (error) return alert('Group exists or error: ' + error.message);

            // Admin self-approval entry
            await supabase.from('members').insert([{
                group_id: groupId,
                username: username,
                user_ip_hash: userIpHash,
                unique_no: 'ADMIN',
                status: 'approved'
            }]);

            await handleEnterGroup();
        }

        // ENTER / REQUEST GROUP JOIN
        async function handleEnterGroup() {
            const groupId = document.getElementById('input-group-id').value.trim();
            const password = document.getElementById('input-password').value.trim();
            const username = document.getElementById('input-username').value.trim();

            if (!groupId || !password) return alert('Group ID & Password required');

            // Validate Group Credentials
            const hashedPassword = await sha256(password);
            const { data: group, error } = await supabase.from('groups').select('*').eq('id', groupId).single();

            if (error || !group || group.password_hash !== hashedPassword) {
                return alert('Invalid group ID or password.');
            }

            currentGroupId = groupId;
            isAdmin = (group.admin_ip_hash === userIpHash);

            // Check existing member status via IP Hash
            let { data: member } = await supabase.from('members')
                .select('*')
                .eq('group_id', groupId)
                .eq('user_ip_hash', userIpHash)
                .single();

            if (!member) {
                if (!username) return alert('Username required for new join request');
                const uniqueNo = 'REQ-' + Math.floor(1000 + Math.random() * 9000);
                
                const { data: newMem } = await supabase.from('members').insert([{
                    group_id: groupId,
                    username: username,
                    user_ip_hash: userIpHash,
                    unique_no: uniqueNo,
                    status: isAdmin ? 'approved' : 'pending'
                }]).select().single();
                
                member = newMem;
            }

            currentUsername = member.username;

            // Switch Views
            document.getElementById('auth-view').classList.add('hidden');
            document.getElementById('chat-container').classList.remove('hidden');
            document.getElementById('qr-btn').classList.remove('hidden');
            document.getElementById('chat-title').innerText = `Group: ${groupId}`;

            if (isAdmin) document.getElementById('admin-btn').classList.remove('hidden');

            evaluateAccess(member);
            subscribeToMemberUpdates();
            generateQRCode();
        }

        // ACCESS EVALUATION & UNLOCKING
        function evaluateAccess(member) {
            document.getElementById('display-unique-no').innerText = member.unique_no;

            if (member.status === 'approved') {
                document.getElementById('lock-overlay').classList.add('hidden');
                document.getElementById('chat-view').classList.remove('blur-locked');
                load7DayMessages();
                subscribeToMessages();
            } else {
                document.getElementById('lock-overlay').classList.remove('hidden');
                document.getElementById('chat-view').classList.add('blur-locked');
            }
        }

        // REAL-TIME STATUS LISTENER (AUTO-UNLOCK WHEN ADMIN APPROVES)
        function subscribeToMemberUpdates() {
            supabase
                .channel(`members-${currentGroupId}`)
                .on('postgres_changes', {
                    event: '*',
                    schema: 'public',
                    table: 'members',
                    filter: `group_id=eq.${currentGroupId}`
                }, payload => {
                    if (payload.new && payload.new.user_ip_hash === userIpHash) {
                        evaluateAccess(payload.new);
                    }
                    if (isAdmin) loadPendingRequests();
                })
                .subscribe();
        }

        // ADMIN: LOAD & PROCESS PENDING REQUESTS
        async function loadPendingRequests() {
            const { data: requests } = await supabase.from('members')
                .select('*')
                .eq('group_id', currentGroupId)
                .eq('status', 'pending');

            const list = document.getElementById('requests-list');
            list.innerHTML = '';

            if (!requests || requests.length === 0) {
                list.innerHTML = '<p class="text-xs text-slate-400">No pending requests.</p>';
                return;
            }

            requests.forEach(req => {
                const div = document.createElement('div');
                div.className = 'p-2 bg-slate-900 rounded flex justify-between items-center text-xs border border-slate-700';
                div.innerHTML = `
                    <div>
                        <span class="font-bold text-white block">${escapeHtml(req.username)}</span>
                        <span class="font-mono text-[10px] text-emerald-400">${req.unique_no}</span>
                    </div>
                    <div class="flex gap-1">
                        <button onclick="updateStatus('${req.id}', 'approved')" class="px-2 py-1 bg-emerald-600 hover:bg-emerald-500 rounded text-white font-bold">Approve</button>
                        <button onclick="updateStatus('${req.id}', 'rejected')" class="px-2 py-1 bg-rose-600 hover:bg-rose-500 rounded text-white font-bold">Reject</button>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        async function updateStatus(memberId, status) {
            await supabase.from('members').update({ status }).eq('id', memberId);
            loadPendingRequests();
        }

        function toggleAdminPanel() {
            const modal = document.getElementById('admin-modal');
            modal.classList.toggle('hidden');
            if (!modal.classList.contains('hidden')) loadPendingRequests();
        }

        // CHAT FUNCTIONS
        async function load7DayMessages() {
            const sevenDaysAgo = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toISOString();
            const { data: messages } = await supabase.from('messages')
                .select('*')
                .eq('group_id', currentGroupId)
                .gte('created_at', sevenDaysAgo)
                .order('created_at', { ascending: true });

            const list = document.getElementById('messages-list');
            list.innerHTML = '';
            if (messages) messages.forEach(renderMessage);
        }

        function subscribeToMessages() {
            supabase
                .channel(`messages-${currentGroupId}`)
                .on('postgres_changes', {
                    event: 'INSERT',
                    schema: 'public',
                    table: 'messages',
                    filter: `group_id=eq.${currentGroupId}`
                }, payload => renderMessage(payload.new))
                .subscribe();
        }

        async function sendMessage() {
            const input = document.getElementById('input-message');
            const text = input.value.trim();
            if (!text) return;
            input.value = '';
            await supabase.from('messages').insert([{
                group_id: currentGroupId,
                username: currentUsername,
                user_ip_hash: userIpHash,
                message: text
            }]);
        }

        function renderMessage(msg) {
            const list = document.getElementById('messages-list');
            const isMe = msg.user_ip_hash === userIpHash;

            const div = document.createElement('div');
            div.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'}`;
            div.innerHTML = `
                <span class="text-[10px] text-slate-400 mb-0.5">${escapeHtml(msg.username)}</span>
                <div class="px-3 py-2 rounded-lg max-w-[80%] text-sm ${isMe ? 'bg-emerald-600 text-white' : 'bg-slate-700 text-slate-200'}">
                    ${escapeHtml(msg.message)}
                </div>
            `;
            list.appendChild(div);
            list.scrollTop = list.scrollHeight;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function generateQRCode() {
            const container = document.getElementById('qrcode');
            container.innerHTML = '';
            const shareUrl = `${window.location.origin}${window.location.pathname}?group=${currentGroupId}`;
            new QRCode(container, { text: shareUrl, width: 180, height: 180 });
        }

        function toggleQRModal() {
            document.getElementById('qr-modal').classList.toggle('hidden');
        }
    </script>
</body>
</html>
